name: Build and report progress

# Runs on a self-hosted runner on the maintainer's PC, where the disc image lives. The disc image
# never leaves that machine: the job hardlinks it into orig/ and uploads only the objdiff report,
# which holds function names and match percentages, no game data.
#
# Safety: code from anyone else must never run on that PC.
#  - No pull_request trigger: forks and PRs never start this workflow.
#  - Only pushes to main (which only people with write access can do) or a manual run.
#  - The job also refuses to run unless the push or manual run came from the repo owner.
#  - The token is read-only.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: [self-hosted, windows, soal]
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Link the disc image
        shell: pwsh
        run: |
          $iso = $env:SOAL_ISO
          if (-not $iso) { $iso = "C:\Users\Nathan\Desktop\folder folder\Roms\GC\Skies of Arcadia Legends.iso" }
          if (-not (Test-Path $iso)) { throw "disc image not found: $iso (set SOAL_ISO in the runner's .env)" }
          $dst = "orig\GEAE8P\GEAE8P.iso"
          if (Test-Path $dst) { Remove-Item $dst -Force }
          try { New-Item -ItemType HardLink -Path $dst -Target $iso -ErrorAction Stop | Out-Null }
          catch { Copy-Item $iso $dst }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $log = "build_log.txt"
          # ninja comes from `pip install --user ninja`, whose user site the runner's Python doesn't see,
          # so call the exe by path (override with SOAL_NINJA in the runner's .env).
          $ninja = $env:SOAL_NINJA
          if (-not $ninja) { $ninja = "C:\Users\Nathan\AppData\Roaming\Python\Python314\Scripts\ninja.exe" }
          if (-not (Test-Path $ninja)) { throw "ninja not found at $ninja (set SOAL_NINJA in the runner's .env)" }
          "python: $((Get-Command python).Source), ninja: $ninja" | Tee-Object $log
          python configure.py *>&1 | Tee-Object $log -Append
          if ($LASTEXITCODE -ne 0) { throw "configure.py failed (exit $LASTEXITCODE), see build_log" }
          & $ninja all_source progress build/GEAE8P/report.json *>&1 | Tee-Object $log -Append
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE), see build_log" }
          & $ninja *>&1 | Tee-Object $log -Append
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE), see build_log" }
          if (-not (Select-String -Path $log -Pattern "main.dol: OK" -Quiet)) { throw "main.dol didn't match, see build_log" }
          if (-not (Test-Path build/GEAE8P/report.json)) { throw "report.json wasn't generated" }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build_log.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: GEAE8P_report
          path: build/GEAE8P/report.json
          if-no-files-found: error
